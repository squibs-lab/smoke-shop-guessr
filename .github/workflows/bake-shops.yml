name: Bake shop list

# Rebuilds shops.json every Monday morning (New York time), and whenever you run it by hand
# from the Actions tab. Free: GitHub Actions minutes are free for public repos, and the
# Street View metadata lookups it makes are never billed.
on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build shops.json
        run: node scripts/bake-shops.mjs
        env:
          STREETVIEW_KEY: ${{ secrets.STREETVIEW_KEY }}
      - name: Commit the new list if it changed
        run: |
          if git diff --quiet -- shops.json && git ls-files --error-unmatch shops.json >/dev/null 2>&1; then
            echo "Shop list unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shops.json
          git commit -m "Update shop list"
          git push
