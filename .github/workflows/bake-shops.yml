name: Bake shop list

# Full rebuild of shops-all.json and shops.json every Monday morning (New York time), and whenever
# you run it by hand from the Actions tab. Free: GitHub Actions minutes are free for public repos,
# and the Street View metadata lookups it makes are never billed.
#
# When reviews.json or custom-shops.json changes, it only re-applies reviews and hand-picked shops to
# the existing shops-all.json, which takes a second and needs no key. (Hand-picked shops without a
# pano set wait for the next full build to find their Street View.)
on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [reviews.json, custom-shops.json]

permissions:
  contents: write

concurrency:
  group: bake-shops
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build shops.json
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -f shops-all.json ]; then
            node scripts/bake-shops.mjs --apply-reviews
          else
            node scripts/bake-shops.mjs
          fi
        env:
          STREETVIEW_KEY: ${{ secrets.STREETVIEW_KEY }}
      - name: Commit the new lists if they changed
        run: |
          git add shops.json shops-all.json
          if git diff --cached --quiet; then
            echo "Shop lists unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update shop list"
          git pull --rebase origin main
          git push
